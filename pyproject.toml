[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csvbench"
version = "0.1.0"
description = "Read, inspect and rewrite malformed CSV files with automatic encoding and separator detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Vinícius Machado", email = "viniciusfm1@outlook.com" }]
keywords = ["csv", "data", "encoding", "parser", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "charset-normalizer>=3.3",
    "chardet>=5.2",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas>=2.3.3"
]
docs = [
    "sphinx>=7.3",
    "sphinx-napoleon>=0.7",
    "furo>=2024.1",
]

[project.scripts]
csvbench = "csvbench.cli.main:app"

[project.urls]
Homepage = "https://github.com/viniciusfm1/csvbench"
Issues = "https://github.com/viniciusfm1/csvbench/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["csvbench*"]

[tool.ruff.lint]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=csvbench --cov-report=term-missing -q"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
